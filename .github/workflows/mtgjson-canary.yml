name: MTGJSON canary

# Checks every day that the newest MTGJSON release still works with this tool: the
# schema the carddata queries use is intact, the committed conformance fixtures are
# what the release produces, and the conformance corpus passes against real data.
#
# A failing run notifies the maintainers through GitHub's normal workflow-failure
# email. No issue is opened.
#
# GitHub disables scheduled workflows in a public repository after 60 days with no
# repository activity. If the canary stops running, push any commit, or re-enable the
# workflow in the Actions tab.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANARY_DATA: /tmp/canary-data
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Steps 1 and 2: download the latest MTGJSON, check both checksums, run the
      # carddata self-check, and build the derived tables.
      - name: Download MTGJSON and run the self-check
        run: pnpm --filter @tcg-gauntlet/carddata exec node scripts/canary.ts refresh --data-dir "$CANARY_DATA"

      # Step 3: regenerate the fixtures (item 42) from the downloaded file and run
      # the test suite on them. MTGJSON publishes a new build every day, so the
      # fixtures almost always differ (the version string at least, often a new
      # printing or an edited row). A difference alone is only a warning; tests
      # that fail on the regenerated fixtures are an error.
      - name: Regenerate the fixtures and run the tests on them
        run: |
          mtgjson="$CANARY_DATA/$(jq -r .path "$CANARY_DATA/mtgjson/current.json")"
          node scripts/build-fixtures.ts --mtgjson "$mtgjson"
          if [ -z "$(git status --porcelain -- conformance/fixtures)" ]; then
            echo "The fixtures are identical to the newest MTGJSON release."
            exit 0
          fi
          git diff --stat -- conformance/fixtures
          if ! pnpm test; then
            echo "::error::The tests fail on fixtures rebuilt from the newest MTGJSON release. Run 'node scripts/build-fixtures.ts --mtgjson <AllPrintings.sqlite>' locally and review the diff and the failing tests."
            exit 1
          fi
          echo "::warning::The conformance fixtures are older than the newest MTGJSON release, and the tests pass on rebuilt ones. Refresh them when convenient: node scripts/build-fixtures.ts --mtgjson <AllPrintings.sqlite>"

      # Step 4: the conformance corpus through SqliteCardLookup, over the full file.
      - name: Run the conformance corpus through SqliteCardLookup
        run: pnpm --filter @tcg-gauntlet/carddata exec node scripts/canary.ts conformance --data-dir "$CANARY_DATA"
