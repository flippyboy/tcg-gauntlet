{{- if and .Values.webhook.secret (not .Values.webhook.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tcg-gauntlet.fullname" . }}
  labels:
    {{- include "tcg-gauntlet.labels" . | nindent 4 }}
type: Opaque
stringData:
  webhook-secret: {{ .Values.webhook.secret | quote }}
{{- end }}
